<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #FFFFFF; }
    #line { width: 100%; height: 100%; }
    html.dark, html.dark body { background: #1E1E1E; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
  <div id="line"></div>
  <script>
    var chart = echarts.init(document.getElementById('line'));
    var isDark = false;

    function applyTheme(dark) {
      isDark = dark;
      document.documentElement.className = dark ? 'dark' : '';
    }

    function renderLineChart(dates, durations) {
      var textColor = isDark ? '#999999' : '#666666';
      var nameColor = isDark ? '#777777' : '#999999';
      var splitColor = isDark ? '#333333' : '#F0F0F0';
      var axisColor = isDark ? '#333333' : '#E0E0E0';
      var lineColor = isDark ? '#4DA6FF' : '#409EFF';
      var areaTop = isDark ? 'rgba(77, 166, 255, 0.3)' : 'rgba(64, 158, 255, 0.3)';
      var areaBottom = isDark ? 'rgba(77, 166, 255, 0.05)' : 'rgba(64, 158, 255, 0.05)';

      var option = {
        grid: {
          left: '12%',
          right: '5%',
          top: '10%',
          bottom: '15%'
        },
        xAxis: {
          type: 'category',
          data: dates,
          axisLabel: {
            color: textColor,
            fontSize: 11
          },
          axisLine: {
            lineStyle: { color: axisColor }
          },
          axisTick: { show: false }
        },
        yAxis: {
          type: 'value',
          name: '分钟',
          nameTextStyle: {
            color: nameColor,
            fontSize: 11
          },
          axisLabel: {
            color: textColor,
            fontSize: 11
          },
          axisLine: { show: false },
          splitLine: {
            lineStyle: { color: splitColor, type: 'dashed' }
          }
        },
        series: [{
          type: 'line',
          data: durations,
          smooth: true,
          symbol: 'circle',
          symbolSize: 8,
          lineStyle: {
            color: lineColor,
            width: 3
          },
          itemStyle: {
            color: lineColor
          },
          areaStyle: {
            color: {
              type: 'linear',
              x: 0, y: 0, x2: 0, y2: 1,
              colorStops: [
                { offset: 0, color: areaTop },
                { offset: 1, color: areaBottom }
              ]
            }
          }
        }],
        tooltip: {
          trigger: 'axis',
          formatter: '{b}<br/>学习时长: {c} 分钟'
        }
      };
      chart.setOption(option);
    }

    window.addEventListener('resize', function() {
      chart.resize();
    });
  </script>
</body>
</html>
